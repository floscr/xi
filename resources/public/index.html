<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- No status-bar-style: black-translucent shifts the whole view up ~59px
       (a WebKit bug), so no height value lands right — too short leaves a
       bottom chin gap, too tall cuts off the compose box. Omitting it lets
       iOS standalone reserve the status bar and handle safe areas itself. -->
  <meta name="apple-mobile-web-app-title" content="Xi">
  <!-- ?v= is a content hash of the PNG — iOS caches home-screen icons by URL,
       so bump it whenever apple-touch-icon.png changes. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2e906564">
  <link rel="icon" type="image/png" href="/apple-touch-icon.png?v=2e906564">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Xi</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/css/style.css?v=6">
  <script>try{var t=localStorage.getItem('ui-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <!-- The active custom theme's CSS properties (xi.web.cache save-theme-vars!),
       set before main.js so the page never paints the default theme first. -->
  <script>try{var v=JSON.parse(localStorage.getItem('xi/theme-vars')||'null');if(v)for(var k in v)document.documentElement.style.setProperty(k,v[k])}catch(e){}</script>
</head>
<body>
  <div id="app">
    <div style="padding: 20px; text-align: center; color: var(--fg-2);">Loading...</div>
  </div>
  <script src="/ui-runtime.js"></script>
  <!-- Dev builds only (release builds ignore it): over https the shadow-cljs
       live-reload socket can't reach ws://<host>:9630 (mixed content), so it
       goes through this origin, which relays it to shadow (xi.server.shadow-relay). -->
  <script>if(location.protocol==='https:')window.CLOSURE_UNCOMPILED_DEFINES={'shadow.cljs.devtools.client.env.devtools_url':location.origin}</script>
  <script src="/js/main.js"></script>
</body>
</html>
