<!DOCTYPE html>
<html>
<head>
  <title>Xi Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1e1e2e; color: #cdd6f4; font-family: monospace; font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
    #log { flex: 1; overflow-y: auto; padding: 12px; white-space: pre-wrap; }
    .event { margin: 2px 0; }
    .event-type { color: #89b4fa; font-weight: bold; }
    .text-delta { color: #a6e3a1; }
    .tool-start { color: #f9e2af; }
    .tool-result { color: #94e2d5; }
    .error { color: #f38ba8; }
    .turn { color: #585b70; }
    .meta { color: #585b70; font-size: 12px; }
    #input-bar { display: flex; border-top: 1px solid #313244; padding: 8px 12px; background: #181825; }
    #input { flex: 1; background: #1e1e2e; color: #cdd6f4; border: 1px solid #313244; padding: 8px; font-family: monospace; font-size: 14px; outline: none; }
    #input:focus { border-color: #89b4fa; }
    #send { background: #89b4fa; color: #1e1e2e; border: none; padding: 8px 16px; margin-left: 8px; cursor: pointer; font-family: monospace; font-weight: bold; }
    #status { padding: 4px 12px; background: #181825; font-size: 12px; color: #585b70; }
    .connected { color: #a6e3a1 !important; }
    .disconnected { color: #f38ba8 !important; }
  </style>
</head>
<body>
  <div id="status" class="disconnected">disconnected</div>
  <div id="log"></div>
  <div id="input-bar">
    <input id="input" placeholder="Type a prompt or /command..." autofocus />
    <button id="send">Send</button>
  </div>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const status = document.getElementById('status');
    let ws;
    let textBuffer = '';

    function appendEvent(html, cls) {
      const div = document.createElement('div');
      div.className = 'event ' + (cls || '');
      div.innerHTML = html;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function flushText() {
      if (textBuffer) {
        appendEvent(textBuffer, 'text-delta');
        textBuffer = '';
      }
    }

    function connect() {
      const port = new URLSearchParams(location.search).get('port') || 7474;
      ws = new WebSocket(`ws://localhost:${port}`);

      ws.onopen = () => {
        status.textContent = `connected to ws://localhost:${port}`;
        status.className = 'connected';
      };

      ws.onclose = () => {
        status.textContent = 'disconnected — reconnecting in 2s...';
        status.className = 'disconnected';
        setTimeout(connect, 2000);
      };

      ws.onmessage = (e) => {
        const event = JSON.parse(e.data);
        switch (event.type) {
          case 'text_delta':
            textBuffer += event.text;
            // Debounce rendering
            clearTimeout(ws._textTimer);
            ws._textTimer = setTimeout(flushText, 50);
            break;
          case 'turn_start':
            flushText();
            appendEvent('<span class="turn">── turn start ──</span>');
            break;
          case 'turn_end':
            flushText();
            const cost = event.cost ? ` ($${event.cost.toFixed(4)})` : '';
            appendEvent(`<span class="turn">── turn end${cost} ──</span>`);
            break;
          case 'tool_start':
            flushText();
            const args = event.arguments ? JSON.stringify(event.arguments).slice(0, 120) : '';
            appendEvent(`<span class="tool-start">$ ${event.name}</span> <span class="meta">${args}</span>`);
            break;
          case 'tool_result':
            const content = Array.isArray(event.content)
              ? event.content.map(b => b.text || '').join('\n')
              : String(event.content || '');
            const preview = content.split('\n').slice(0, 5).join('\n');
            const cls = event.is_error ? 'error' : 'tool-result';
            appendEvent(`<span class="${cls}">${preview}</span>`);
            break;
          case 'error':
            flushText();
            appendEvent(`<span class="error">[error] ${JSON.stringify(event.error)}</span>`);
            break;
          case 'ready':
            appendEvent(`<span class="meta">Xi ready — model: ${event.model}</span>`);
            break;
          case 'busy_changed':
            status.textContent = event.busy ? 'working...' : 'connected';
            break;
          case 'command_result':
          case 'command_error':
            flushText();
            appendEvent(`<span class="meta">${JSON.stringify(event)}</span>`);
            break;
          default:
            appendEvent(`<span class="meta">${JSON.stringify(event)}</span>`);
        }
      };
    }

    function send() {
      const text = input.value.trim();
      if (!text || !ws || ws.readyState !== 1) return;
      input.value = '';

      // Parse slash commands
      if (text.startsWith('/')) {
        const parts = text.split(/\s+/);
        const name = parts[0].slice(1);
        const args = parts.slice(1).join(' ') || undefined;
        ws.send(JSON.stringify({ type: 'command', name, args }));
      } else {
        ws.send(JSON.stringify({ type: 'prompt', text }));
      }

      appendEvent(`<span class="event-type">you:</span> ${text}`);
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
    document.getElementById('send').addEventListener('click', send);

    connect();
  </script>
</body>
</html>
